<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Viewer</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      /* ↓ ここで背景色を変更できます */
      background: #f5f5f0; /* ダークグレー（モデルが引き立つおすすめ色） */
    }

    model-viewer {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

  <model-viewer
    src="model.glb"
    camera-controls
    auto-rotate
    shadow-intensity="1.5"
    shadow-softness="0.8"
    exposure="1.2">
  </model-viewer>

</body>
</html>
